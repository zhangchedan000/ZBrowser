name: Windows Build
# ZBrowser CI

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows packages
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZBrowser-Windows-x64
          path: |
            release/*.msi
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $title = "ZBrowser $version"
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in @(".msi", ".exe", ".zip") } | ForEach-Object { $_.FullName }

          if (-not $assets) {
            throw "No Windows release assets were found."
          }

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag @assets --repo "${{ github.repository }}" --target "${{ github.sha }}" --title $title --prerelease --notes "Automated Windows beta build for ZBrowser $version."
          }
