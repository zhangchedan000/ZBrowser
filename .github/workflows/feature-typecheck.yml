name: Feature Typecheck

on:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/shared/environment-check.test.ts --fileParallelism=false
