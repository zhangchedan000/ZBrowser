name: Windows Beta Release

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/windows-beta-release.yml"
      - ".github/workflows/windows-full-e2e.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: windows-beta-release-dev
  cancel-in-progress: true

jobs:
  wait-for-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for Windows validation
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const sha = context.sha
            const required = new Set(["Windows Build", "Windows Full E2E"])
            const deadline = Date.now() + 30 * 60 * 1000

            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: sha,
                per_page: 100
              })

              const latest = new Map()
              for (const run of data.workflow_runs) {
                if (!required.has(run.name)) continue
                if (!latest.has(run.name) || run.run_number > latest.get(run.name).run_number) {
                  latest.set(run.name, run)
                }
              }

              core.info(JSON.stringify([...latest.values()].map(run => ({
                name: run.name,
                status: run.status,
                conclusion: run.conclusion,
                html_url: run.html_url
              }))))

              if ([...required].every(name => latest.get(name)?.status === "completed")) {
                for (const name of required) {
                  const run = latest.get(name)
                  if (run.conclusion !== "success") {
                    core.setFailed(name + " finished with " + run.conclusion)
                    return
                  }
                }
                core.info("Required Windows validation succeeded.")
                return
              }

              await new Promise(resolve => setTimeout(resolve, 30000))
            }

            core.setFailed("Timed out waiting for required Windows validation.")

  publish:
    needs: wait-for-validation
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4

      - name: Verify release identity
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne "0.2.0-beta.7") {
            throw "Expected package version 0.2.0-beta.7, got $version"
          }
          if ("$env:GITHUB_SHA" -eq "") {
            throw "Missing GITHUB_SHA"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run dist:win

      - name: Verify release assets
        shell: pwsh
        run: |
          $assets = Get-ChildItem release -File | Where-Object {
            $_.Extension -in @(".msi", ".exe", ".zip")
          }
          $assets | ForEach-Object { Write-Host $_.FullName }
          if (-not ($assets | Where-Object Extension -eq ".msi")) { throw "MSI asset missing" }
          if (-not ($assets | Where-Object Extension -eq ".exe")) { throw "EXE asset missing" }
          if (-not ($assets | Where-Object Extension -eq ".zip")) { throw "ZIP asset missing" }

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.0-beta.7"
          $existingJson = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if ($existing.isDraft -or -not $existing.isPrerelease) {
              throw "Existing $tag is not the expected published prerelease."
            }
            $assetNames = @($existing.assets | ForEach-Object { $_.name })
            foreach ($required in @(
              "ZBrowser.0.2.0-beta.7.exe",
              "ZBrowser.Setup.0.2.0-beta.7.msi",
              "ZBrowser.Setup.0.2.0-beta.7.zip"
            )) {
              if ($assetNames -notcontains $required) {
                throw "Existing $tag is missing required asset $required"
              }
            }
            Write-Host "Release $tag already exists with all required assets; leaving it unchanged."
            exit 0
          }
          $assets = Get-ChildItem release -File | Where-Object {
            $_.Extension -in @(".msi", ".exe", ".zip")
          } | Select-Object -ExpandProperty FullName
          gh release create $tag @assets `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "ZBrowser 0.2.0-beta.7" `
            --generate-notes `
            --prerelease
