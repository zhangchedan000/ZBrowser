name: Windows Full E2E Auto Retry

on:
  workflow_run:
    workflows: ["Windows Full E2E"]
    types: [completed]
    branches: [dev]

permissions:
  actions: write
  contents: read

jobs:
  rerun-failed:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 4
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs from the same checkpoint
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            core.info(`Auto retrying failed jobs for run ${run.id}; attempt ${run.run_attempt + 1}/4`)
            await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id
            })
