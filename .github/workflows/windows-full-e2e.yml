name: Windows Full E2E

on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "tools/app-e2e/**"
      - "tools/proxy-e2e/**"
      - "tools/kernel-lock.json"
      - "tools/kernel-patches/**"
      - "tools/windows-kernel/patches/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-full-e2e.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-full-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve resume stage
        shell: pwsh
        run: |
          $message = @'
          ${{ github.event.head_commit.message }}
          '@
          $stage = "full"
          if ($message -match '\[resume:kernel\]') { $stage = "kernel" }
          elseif ($message -match '\[resume:dev-e2e\]') { $stage = "dev-e2e" }
          elseif ($message -match '\[resume:package\]') { $stage = "package" }
          "ZBROWSER_RESUME_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resume stage: $stage"

      - name: Real HTTP and SOCKS5 proxy smoke
        shell: pwsh
        env:
          ZBROWSER_TEST_HTTP_PROXY_URL: ${{ secrets.ZBROWSER_TEST_HTTP_PROXY_URL }}
          ZBROWSER_TEST_SOCKS5_PROXY: ${{ secrets.ZBROWSER_TEST_SOCKS5_PROXY }}
          ZBROWSER_PROXY_E2E_OUTPUT: test-results/proxy-e2e.json
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:ZBROWSER_TEST_SOCKS5_PROXY)) {
            throw "SOCKS5 real-proxy smoke is a required check, but ZBROWSER_TEST_SOCKS5_PROXY is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:ZBROWSER_TEST_HTTP_PROXY_URL)) {
            throw "ZBROWSER_TEST_HTTP_PROXY_URL is not configured; the current proxy smoke runner requires both provider inputs."
          }

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Proxy smoke attempt $attempt/$maxAttempts"
            node tools/proxy-e2e/run.mjs
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds (10 * $attempt)
            }
          }

          $report = Get-Content "test-results/proxy-e2e.json" -Raw | ConvertFrom-Json
          $socks = $report.results | Where-Object { $_.name -eq "socks5" } | Select-Object -First 1
          $http = $report.results | Where-Object { $_.name -eq "http" } | Select-Object -First 1

          if (-not $report.noDirectFallback) {
            throw "Proxy fail-closed check failed"
          }
          if (-not $socks -or -not $socks.ok) {
            throw "SOCKS5 real-proxy smoke failed after retries"
          }
          if ($http -and -not $http.ok) {
            Write-Warning "HTTP provider smoke failed after retries; continuing because SOCKS5 and fail-closed behavior passed."
          }
          exit 0

      - name: Diagnose all kernel patch hashes
        if: env.ZBROWSER_RESUME_STAGE == 'full' || env.ZBROWSER_RESUME_STAGE == 'kernel'
        shell: pwsh
        run: |
          Get-ChildItem "tools/kernel-patches" -Filter "*.patch" -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            Write-Host "$($_.Name) SHA256=$hash"
          }

      - name: Typecheck and unit/integration tests
        if: env.ZBROWSER_RESUME_STAGE == 'full'
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vitest run --fileParallelism=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify kernel lock
        if: env.ZBROWSER_RESUME_STAGE == 'full' || env.ZBROWSER_RESUME_STAGE == 'kernel'
        run: npm run kernel:verify-lock

      - name: Ensure Electron runtime
        if: env.ZBROWSER_RESUME_STAGE != 'package'
        shell: pwsh
        run: |
          $electron = "node_modules/electron/dist/electron.exe"
          if (-not (Test-Path $electron)) {
            Write-Host "Electron runtime is missing after npm ci; reinstalling the Electron binary."
            Remove-Item "node_modules/electron/path.txt" -Force -ErrorAction SilentlyContinue
            Remove-Item "node_modules/electron/dist" -Recurse -Force -ErrorAction SilentlyContinue
            node node_modules/electron/install.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $electron)) {
            throw "Electron runtime is still missing after reinstall: $electron"
          }
          Write-Host "Electron runtime ready: $electron"

      - name: Build application
        if: env.ZBROWSER_RESUME_STAGE != 'package'
        run: npm run build

      - name: Kernel Manager UI smoke
        if: env.ZBROWSER_RESUME_STAGE != 'package'
        run: node tools/app-e2e/kernel-manager-ui.mjs

      - name: Development-runtime full app E2E
        if: env.ZBROWSER_RESUME_STAGE != 'package'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          npm run audit:app-e2e -- --install-kernel-version 144.0.7559.132 --output test-results/app-e2e-development.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows packages
        shell: pwsh
        run: |
          $maxAttempts = 2
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Windows package build attempt $attempt/$maxAttempts"
            npm run dist:win
            if ($LASTEXITCODE -eq 0) { exit 0 }

            $exitCode = $LASTEXITCODE
            if ($attempt -lt $maxAttempts) {
              Write-Warning "Windows packaging failed, likely during an external electron-builder tool download. Clearing partial release output and retrying once."
              Remove-Item "release" -Recurse -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 15
            } else {
              exit $exitCode
            }
          }

      - name: Locate packaged ZBrowser executable
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path release -Filter "ZBrowser.exe" -File -Recurse |
            Where-Object { $_.FullName -match "win-unpacked" } |
            Select-Object -First 1
          if (-not $app) {
            Get-ChildItem -Path release -Recurse | Select-Object FullName
            throw "Packaged ZBrowser.exe was not found under release/win-unpacked"
          }
          "ZBROWSER_PACKAGED_APP=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packaged app: $($app.FullName)"

      - name: Packaged-app full E2E
        shell: pwsh
        run: |
          npm run audit:app-e2e -- --app "$env:ZBROWSER_PACKAGED_APP" --packaged --install-kernel-version 144.0.7559.132 --output test-results/app-e2e-packaged.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release deliverables
        shell: pwsh
        run: |
          $msi = Get-ChildItem release -Filter "*.msi" -File
          $portable = Get-ChildItem release -Filter "*.exe" -File | Where-Object { $_.Name -notmatch "win-unpacked" }
          $zip = Get-ChildItem release -Filter "*.zip" -File
          if (-not $msi) { throw "MSI release artifact missing" }
          if (-not $portable) { throw "Portable EXE release artifact missing" }
          if (-not $zip) { throw "ZIP release artifact missing" }
          Write-Host "MSI:"
          $msi | Select-Object Name,Length
          Write-Host "EXE:"
          $portable | Select-Object Name,Length
          Write-Host "ZIP:"
          $zip | Select-Object Name,Length

      - name: Export and verify Beta acceptance kit
        shell: pwsh
        run: |
          npm run beta:export-kit -- release/beta-acceptance-kit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run beta:verify-kit -- release/beta-acceptance-kit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish immutable GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $title = "ZBrowser $version"
          $sha = "${{ github.sha }}"
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in @(".msi", ".exe", ".zip") } | ForEach-Object { $_.FullName }

          if (-not $assets) {
            throw "No Windows release assets were found."
          }

          $existingTarget = gh release view $tag --repo "${{ github.repository }}" --json targetCommitish --jq '.targetCommitish' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingTarget -ne $sha) {
              Write-Host "Release $tag is immutable and already points to $existingTarget. This dev build is $sha, so publishing is skipped until package.json is bumped to a new version."
              exit 0
            }
            Write-Host "Release $tag already points to this commit. Existing assets are immutable; skipping publish."
            exit 0
          }

          gh release create $tag @assets --repo "${{ github.repository }}" --target $sha --title $title --prerelease --notes "Automated Windows beta build for ZBrowser $version after packaged-app Full E2E passed."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload full E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZBrowser-Windows-Full-E2E
          path: |
            test-results/*.json
          if-no-files-found: warn
