name: Windows Full E2E

on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "tools/app-e2e/**"
      - "tools/proxy-e2e/**"
      - "tools/kernel-lock.json"
      - "tools/kernel-patches/**"
      - "tools/windows-kernel/patches/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-full-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-full-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve resume stage
        shell: pwsh
        run: |
          $message = @'
          ${{ github.event.head_commit.message }}
          '@
          $stage = "full"
          if ($message -match '\[resume:kernel\]') { $stage = "kernel" }
          elseif ($message -match '\[resume:dev-e2e\]') { $stage = "dev-e2e" }
          elseif ($message -match '\[resume:package\]') { $stage = "package" }
          "ZBROWSER_RESUME_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resume stage: $stage"

      - name: Real HTTP and SOCKS5 proxy smoke
        shell: pwsh
        env:
          ZBROWSER_TEST_HTTP_PROXY_URL: ${{ secrets.ZBROWSER_TEST_HTTP_PROXY_URL }}
          ZBROWSER_TEST_SOCKS5_PROXY: ${{ secrets.ZBROWSER_TEST_SOCKS5_PROXY }}
          ZBROWSER_PROXY_E2E_OUTPUT: test-results/proxy-e2e.json
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:ZBROWSER_TEST_HTTP_PROXY_URL) -or [string]::IsNullOrWhiteSpace($env:ZBROWSER_TEST_SOCKS5_PROXY)) {
            Write-Host "Real proxy smoke skipped because one or more repository secrets are not configured."
            exit 0
          }

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Proxy smoke attempt $attempt/$maxAttempts"
            node tools/proxy-e2e/run.mjs
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          exit 1

      - name: Diagnose all kernel patch hashes
        if: env.ZBROWSER_RESUME_STAGE == 'full' || env.ZBROWSER_RESUME_STAGE == 'kernel'
        shell: pwsh
        run: |
          Get-ChildItem "tools/kernel-patches" -Filter "*.patch" -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            Write-Host "$($_.Name) SHA256=$hash"
          }

      - name: Typecheck and unit/integration tests
        if: env.ZBROWSER_RESUME_STAGE == 'full'
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vitest run --fileParallelism=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify kernel lock
        if: env.ZBROWSER_RESUME_STAGE == 'full' || env.ZBROWSER_RESUME_STAGE == 'kernel'
        run: npm run kernel:verify-lock

      - name: Ensure Electron runtime
        if: env.ZBROWSER_RESUME_STAGE != 'package'
        shell: pwsh
        run: |
          $electron = "node_modules/electron/dist/electron.exe"
          if (-not (Test-Path $electron)) {
            Write-Host "Electron runtime is missing after npm ci; reinstalling the Electron binary."
            Remove-Item "node_modules/electron/path.txt" -Force -ErrorAction SilentlyContinue
            Remove-Item "node_modules/electron/dist" -Recurse -Force -ErrorAction SilentlyContinue
            node node_modules/electron/install.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $electron)) {
            throw "Electron runtime is still missing after reinstall: $electron"
          }
          Write-Host "Electron runtime ready: $electron"

      - name: Build application
        if: env.ZBROWSER_RESUME_STAGE != 'package'
        run: npm run build

      - name: Development-runtime full app E2E
        if: env.ZBROWSER_RESUME_STAGE != 'package'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          npm run audit:app-e2e -- --install-kernel-version 144.0.7559.132 --output test-results/app-e2e-development.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows packages
        run: npm run dist:win

      - name: Locate packaged ZBrowser executable
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path release -Filter "ZBrowser.exe" -File -Recurse |
            Where-Object { $_.FullName -match "win-unpacked" } |
            Select-Object -First 1
          if (-not $app) {
            Get-ChildItem -Path release -Recurse | Select-Object FullName
            throw "Packaged ZBrowser.exe was not found under release/win-unpacked"
          }
          "ZBROWSER_PACKAGED_APP=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packaged app: $($app.FullName)"

      - name: Packaged-app full E2E
        shell: pwsh
        run: |
          npm run audit:app-e2e -- --app "$env:ZBROWSER_PACKAGED_APP" --packaged --install-kernel-version 144.0.7559.132 --output test-results/app-e2e-packaged.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release deliverables
        shell: pwsh
        run: |
          $msi = Get-ChildItem release -Filter "*.msi" -File
          $portable = Get-ChildItem release -Filter "*.exe" -File | Where-Object { $_.Name -notmatch "win-unpacked" }
          $zip = Get-ChildItem release -Filter "*.zip" -File
          if (-not $msi) { throw "MSI release artifact missing" }
          if (-not $portable) { throw "Portable EXE release artifact missing" }
          if (-not $zip) { throw "ZIP release artifact missing" }
          Write-Host "MSI:"
          $msi | Select-Object Name,Length
          Write-Host "EXE:"
          $portable | Select-Object Name,Length
          Write-Host "ZIP:"
          $zip | Select-Object Name,Length

      - name: Upload full E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZBrowser-Windows-Full-E2E
          path: |
            test-results/*.json
          if-no-files-found: warn
