name: Inspect Community Kernel

on:
  push:
    branches:
      - "feature/kernel-integration"
    paths:
      - ".github/workflows/inspect-community-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned upstream Community package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/DFarm6/Prism-Browser-Community/releases/download/v0.3.10/Prism-Browser-0.3.10-windows-x64-portable.zip"
          $expected = "66bbb84811a27f97f825ebc94cd9851ac813c106588da442dc99dfc48e308d0b"
          Invoke-WebRequest -Uri $url -OutFile upstream-portable.zip
          $actual = (Get-FileHash upstream-portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 mismatch: $actual" }
          "Verified upstream package: $actual"

      - name: Inspect kernel layout and license files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -Path upstream-portable.zip -DestinationPath upstream -Force

          "=== Candidate kernel manifests ==="
          Get-ChildItem upstream -Recurse -File -Filter manifest.json |
            Where-Object { $_.FullName -match "[\\/]kernels?[\\/]" } |
            ForEach-Object {
              "MANIFEST: $($_.FullName)"
              Get-Content $_.FullName -Raw
            }

          "=== Kernel directories ==="
          Get-ChildItem upstream -Recurse -Directory |
            Where-Object { $_.FullName -match "[\\/]kernels?([\\/]|$)" } |
            Select-Object -First 80 -ExpandProperty FullName

          "=== License / notice files near packaged browser ==="
          Get-ChildItem upstream -Recurse -File |
            Where-Object { $_.Name -match "^(LICENSE|LICENSES|NOTICE|NOTICE\.txt|LICENSE\.txt)$" } |
            Select-Object -First 120 -ExpandProperty FullName

          "=== chrome.exe candidates ==="
          Get-ChildItem upstream -Recurse -File -Filter chrome.exe |
            Select-Object -First 20 -ExpandProperty FullName
