name: Bootstrap ZBrowser v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import upstream once
        shell: bash
        run: |
          if [ -f .zbrowser_bootstrapped ]; then
            echo "Already bootstrapped."
            exit 0
          fi
          git clone --depth 1 https://github.com/DFarm6/Prism-Browser-Community.git /tmp/prism
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' /tmp/prism/ ./
          cat > UPSTREAM.md <<'EOF'
          # Upstream

          ZBrowser started from the MIT-licensed Prism Browser Community project:
          https://github.com/DFarm6/Prism-Browser-Community

          The original MIT license and third-party notices are retained.
          EOF
          touch .zbrowser_bootstrapped
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import Prism Community as ZBrowser base"
          git push
